name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python deps
        working-directory: backend
        run: pip install -r requirements.txt pyinstaller

      - name: Build app
        working-directory: backend
        run: pyinstaller --noconfirm --windowed --name "File Organiser" --add-data "../frontend/dist:dist" main.py

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        working-directory: backend
        run: |
          choco install innosetup -y --no-progress
          iscc /DVersion=${{ github.ref_name }} installer.iss

      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        working-directory: backend
        run: |
          mkdir dist/dmg
          cp -R "dist/File Organiser.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "File Organiser" -srcfolder dist/dmg -ov -format UDZO dist/File-Organiser-macOS.dmg

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            backend/dist/*.exe
            backend/dist/*.dmg
